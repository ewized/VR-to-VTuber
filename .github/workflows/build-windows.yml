name: Build Windows executable

on:
  push:
    branches: ['build/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      NO_PROXY: localhost,127.0.0.1,127.0.0.2,::1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt pyinstaller
      - name: Run automated checks
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff format --check tests/test_connections.py tests/test_ui.py
      - name: Build executable
        run: python -m PyInstaller --noconfirm 'VR to VTuber.spec'
      - name: Check executable starts
        run: |
          $app = Start-Process -FilePath '.\dist\VR to VTuber.exe' -PassThru
          try {
            Start-Sleep -Seconds 5
            $app.Refresh()
            if ($app.HasExited) { throw "Application exited during startup: $($app.ExitCode)" }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id }
          }
      - name: Record build provenance
        run: |
          $hash = (Get-FileHash 'dist\VR to VTuber.exe' -Algorithm SHA256).Hash.ToLower()
          "$hash  VR to VTuber.exe" | Set-Content -Encoding ascii 'dist\VR to VTuber.exe.sha256'
          "Source commit: $env:GITHUB_SHA" | Set-Content -Encoding ascii 'dist\build-info.txt'
          python -m pip freeze | Add-Content 'dist\build-info.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: VR-to-VTuber-Windows
          path: |
            dist/VR to VTuber.exe
            dist/VR to VTuber.exe.sha256
            dist/build-info.txt
          if-no-files-found: error
          retention-days: 14
